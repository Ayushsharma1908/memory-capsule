<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Capsule Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap"
    rel="stylesheet">
  <script src="../assets/lucide.min.js"></script>
  <link rel="stylesheet" href="viewer.css">
</head>

<body>
  <div id="toast" class="toast" aria-live="polite"></div>
  <nav class="topbar">
    <div class="topbar-inner">
      <a href="#" class="topbar-brand" id="backLink">
        <i data-lucide="arrow-left" class="back-icon"></i>

        <img src="../assets/icon-128.png" alt="Memory Capsule Logo" class="topbar-icon" />

        <div class="brand-text">
          <span class="brand-title">Memory Capsule</span>
          <span class="brand-subtitle">Capsule Viewer</span>
        </div>
      </a>
      <button id="downloadBtn" class="btn-sm" style="display: none;">
        <i data-lucide="download"></i>
        <span>Export JSON</span>
      </button>
    </div>
  </nav>

  <main class="page">
    <header class="hero" id="heroHeader">

      <div class="hero-badge">
        <i data-lucide="brain"></i>
        <span>Memory Capsule</span>
      </div>

      <h1 class="hero-title" id="title">
        Loading Capsule...
      </h1>

      <p class="hero-summary" id="summary"></p>

      <div class="hero-meta" id="metadata"></div>

    </header>

    <section class="section" id="topicsSection" style="display: none;">
      <header class="section-header">
        <div class="section-label">
          <i data-lucide="tag"></i>
          <span>Key Topics</span>
        </div>
      </header>
      <div id="topics" class="topic-grid"></div>
    </section>

    <section class="section" id="insightsSection" style="display: none;">
      <div class="section-label">
        <i data-lucide="lightbulb"></i>
        <span>Insights</span>
      </div>
      <div id="insights" class="insight-list"></div>
    </section>

    <section class="section" id="conversationSection" style="display: none;">
      <div class="section-label">
        <i data-lucide="message-circle"></i>
        <span>Conversation Timeline</span>
      </div>
      <div id="conversation" class="conversation-feed"></div>
    </section>

    <footer class="page-footer">
      <span class="footer-text">
        Generated by Memory Capsule
      </span>
      <span class="footer-version">
        v1.0
      </span>
    </footer>

  </main>

  <script src="viewer.js"></script>
</body>

</html>
