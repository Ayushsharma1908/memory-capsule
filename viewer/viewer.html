<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Capsule Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
    rel="stylesheet">
  <script src="../assets/lucide.min.js"></script>
  <link rel="stylesheet" href="viewer.css">
</head>

<body>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <!-- Top Bar (fixed) -->
  <nav class="topbar">
    <div class="topbar-inner">
      <a href="#" class="topbar-brand" id="backLink">
        <img src="../assets/icon-128.png" alt="" class="topbar-icon" />
        <span>Memory Capsule</span>
      </a>
      <button id="downloadBtn" class="btn-sm" style="display: none;">
        <i data-lucide="download"></i>
        <span>Download JSON</span>
      </button>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="page">

    <!-- Hero Header -->
    <header class="hero" id="heroHeader">
      <h1 class="hero-title" id="title">Loading Capsule…</h1>
      <p class="hero-summary" id="summary"></p>
      <div class="hero-meta" id="metadata"></div>
    </header>

    <!-- Sections -->

    <section class="section" id="topicsSection" style="display: none;">
      <div class="section-label">
        <i data-lucide="tag"></i>
        <span>Key Topics</span>
      </div>
      <div id="topics" class="topic-grid"></div>
    </section>

    <section class="section" id="insightsSection" style="display: none;">
      <div class="section-label">
        <i data-lucide="lightbulb"></i>
        <span>Insights</span>
      </div>
      <div id="insights" class="insight-list"></div>
    </section>

    <section class="section" id="conversationSection" style="display: none;">
      <div class="section-label">
        <i data-lucide="message-circle"></i>
        <span>Original Conversation</span>
      </div>
      <div id="conversation" class="conversation-feed"></div>
    </section>

    <!-- Back to Top / Footer -->
    <footer class="page-footer">
      <span class="footer-text">Memory Capsule</span>
    </footer>

  </main>

  <script src="viewer.js"></script>
</body>

</html>
